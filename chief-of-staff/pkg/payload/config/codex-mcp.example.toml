# Example Codex connector settings for the chief of staff.
#
# This file is an EXAMPLE. The installer does not apply it and never edits
# ~/.codex/config.toml. Copy the parts you need into ~/.codex/config.toml
# yourself, then restart Codex. See docs/CONNECTORS.md.
#
# Two things are placeholders and must be replaced:
#   1. Every url value. Use the MCP address published by that vendor, or skip
#      the block if you connect that system through a plugin instead.
#   2. Every tool name. Tool names differ per connector. Type /mcp in Codex to
#      see the real names, then list the send and write tools below.
#
# Why bother: scheduled runs are unattended and may run without approval
# prompts. Disabling send tools here is the only hard block. The instructions
# in AGENTS.md and the action ledger are guardrails, not enforcement.

[mcp_servers.hubspot]
url = "https://REPLACE-WITH-VENDOR-MCP-URL"
# Hide tools that write, so the assistant can only read and propose.
disabled_tools = ["REPLACE_WITH_CRM_WRITE_TOOL_NAME"]

[mcp_servers.transcripts]
url = "https://REPLACE-WITH-VENDOR-MCP-URL"

[mcp_servers.gmail]
url = "https://REPLACE-WITH-VENDOR-MCP-URL"
# Keep the draft tool. Remove the send tools.
disabled_tools = ["REPLACE_WITH_SEND_TOOL_NAME", "REPLACE_WITH_REPLY_TOOL_NAME"]

# Alternative to disabling a tool: keep it, but always ask first.
[mcp_servers.calendar]
url = "https://REPLACE-WITH-VENDOR-MCP-URL"

[mcp_servers.calendar.tools.REPLACE_WITH_CREATE_EVENT_TOOL_NAME]
approval_mode = "approve"
